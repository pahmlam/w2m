[project]
name = "w2m-backend"
version = "0.2.0"
description = "Where to meet — directed road-network meeting optimization"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "shapely>=2.0,<3",
  "pyproj>=3.7,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
data = ["osmnx>=2.0,<3", "geopandas>=1.0,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "networkx>=3.4,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

